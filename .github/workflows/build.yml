name: Build Executables

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, Application_V2]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # macOS build
  # ─────────────────────────────────────────────
  build-macos:
    name: macOS
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          clean: true
          set-safe-directory: true

      - name: Verify git checkout
        run: |
          set -euo pipefail
          which git
          git --version
          git rev-parse --is-inside-work-tree
          git rev-parse HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Clean previous build outputs
        run: |
          set -euo pipefail
          rm -rf dist
          rm -rf build/pyinstaller.macos

      - name: Convert icon PNG → icns
        run: |
          set -euo pipefail
          mkdir -p Icons/BSC_Icon.iconset
          sips -z 16   16   Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_16x16.png
          sips -z 32   32   Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_16x16@2x.png
          sips -z 32   32   Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_32x32.png
          sips -z 64   64   Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_32x32@2x.png
          sips -z 128  128  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_128x128.png
          sips -z 256  256  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_128x128@2x.png
          sips -z 256  256  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_256x256.png
          sips -z 512  512  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_256x256@2x.png
          sips -z 512  512  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_512x512.png
          sips -z 1024 1024 Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_512x512@2x.png
          iconutil -c icns Icons/BSC_Icon.iconset -o Icons/BSC_Icon.icns

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm BallSpinnerController.spec

      - name: Verify macOS app bundle exists
        continue-on-error: false
        run: |
          set -euo pipefail
          if [ ! -d "dist/BallSpinnerController.app" ]; then
            echo "ERROR: Missing macOS app bundle at dist/BallSpinnerController.app"
            exit 1
          fi
          if [ ! -f "dist/BallSpinnerController.app/Contents/Info.plist" ]; then
            echo "ERROR: Missing Info.plist inside macOS app bundle"
            exit 1
          fi
          if [ ! -f "dist/BallSpinnerController.app/Contents/MacOS/BallSpinnerController" ]; then
            echo "ERROR: Missing executable inside macOS app bundle"
            exit 1
          fi

      - name: Create entitlements file
        run: |
          set -euo pipefail
          cat > /tmp/entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Ad-hoc sign macOS app bundle with entitlements
        run: |
          set -euo pipefail
          APP_BUNDLE="dist/BallSpinnerController.app"
          
          # Step 1: Clean extended attributes and resource forks (prevents "detritus not allowed" errors)
          echo "Cleaning extended attributes..."
          xattr -rc "$APP_BUNDLE" || true
          find "$APP_BUNDLE" -name "._*" -delete || true
          
          # Step 2: Remove any existing signatures
          echo "Removing existing signatures..."
          codesign --remove-signature "$APP_BUNDLE" 2>/dev/null || true
          
          # Step 3: Sign all frameworks and nested components with --deep
          echo "Signing all components (--deep)..."
          codesign \
            --force \
            --deep \
            --sign - \
            --entitlements /tmp/entitlements.plist \
            "$APP_BUNDLE"
          
          # Step 4: Verify signature
          echo "Verifying signature..."
          codesign --verify --verbose "$APP_BUNDLE"

      - name: Diagnostic - Show executable architecture and details
        run: |
          set -euo pipefail
          APP_BIN="dist/BallSpinnerController.app/Contents/MacOS/BallSpinnerController"
          echo "=== System Info ==="
          uname -m
          sw_vers
          echo ""
          echo "=== Executable Details ==="
          file "$APP_BIN"
          ls -lh "$APP_BIN"
          echo ""
          echo "=== Code Signature Details ==="
          codesign -dvvv "$APP_BIN" || true
          codesign -d --entitlements :- "$APP_BIN" || true

      - name: Diagnostic - Check bundled dependencies
        run: |
          set -euo pipefail
          APP_BIN="dist/BallSpinnerController.app/Contents/MacOS/BallSpinnerController"
          echo "=== Direct Dependencies (otool -L) ==="
          otool -L "$APP_BIN" | head -30
          echo ""
          echo "=== Framework Bundles ==="
          find "dist/BallSpinnerController.app" \( -name "*.framework" -o -name "*.so" -o -name "*.dylib" \) | head -20 || true

      - name: Smoke test app launch with diagnostics
        continue-on-error: true
        run: |
          set -euo pipefail
          APP_BIN="dist/BallSpinnerController.app/Contents/MacOS/BallSpinnerController"
          chmod +x "$APP_BIN"
          echo "=== Headless Smoke Test (QT_QPA_PLATFORM=offscreen) ==="
          
          # Use background process instead of timeout command (not available on macOS)
          QT_QPA_PLATFORM=offscreen "$APP_BIN" > macos-launch.log 2>&1 &
          APP_PID=$!
          sleep 6
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "✓ App survived 6 seconds in headless mode"
            kill "$APP_PID" || true
            wait "$APP_PID" 2>/dev/null || true
          else
            echo "✗ App exited during headless smoke test"
            wait "$APP_PID" 2>/dev/null
            EXIT_CODE=$?
            echo "Exit code: $EXIT_CODE"
          fi
          echo ""
          echo "=== App Output Log ==="
          cat macos-launch.log || echo "(No output captured)"

      - name: Smoke test - GUI mode with output capture
        continue-on-error: true
        run: |
          set -euo pipefail
          APP_BIN="dist/BallSpinnerController.app/Contents/MacOS/BallSpinnerController"
          echo "=== Attempting GUI Launch (5 second test) ==="
          
          # Use background process with timeout logic instead of timeout command
          "$APP_BIN" > macos-gui-launch.log 2>&1 &
          APP_PID=$!
          
          # Wait up to 5 seconds for app to start
          for i in {1..5}; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          
          # Kill if still running
          if kill -0 "$APP_PID" 2>/dev/null; then
            kill "$APP_PID" || true
            wait "$APP_PID" 2>/dev/null || true
            echo "✓ GUI app started successfully"
          else
            wait "$APP_PID" 2>/dev/null || true
          fi
          
          echo ""
          echo "=== GUI Mode Output Log ==="
          cat macos-gui-launch.log || echo "(No output captured)"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-diagnostics
          path: |
            macos-launch.log
            macos-gui-launch.log
          if-no-files-found: ignore

      - name: Package macOS app bundle
        run: |
          set -euo pipefail
          rm -f dist/BallSpinnerController-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent "dist/BallSpinnerController.app" "dist/BallSpinnerController-macOS.zip"
          test -f "dist/BallSpinnerController-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: BallSpinnerController-macOS-app
          path: dist/BallSpinnerController-macOS.zip
          if-no-files-found: error
  # ─────────────────────────────────────────────
  # Windows build
  # ─────────────────────────────────────────────
  build-windows:
    name: Windows
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          clean: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Clean previous build outputs
        run: |
          if (Test-Path dist) { Remove-Item -Path dist -Recurse -Force }
          if (Test-Path build) { Remove-Item -Path build -Recurse -Force }

      - name: Convert icon PNG → ICO
        run: |
          python -c "from PIL import Image; img = Image.open('Icons/BSC_Icon.png'); img.save('Icons/BSC_Icon.ico', 'ICO', sizes=[(16,16), (32,32), (48,48), (64,64), (128,128), (256,256)])"
          if (-not (Test-Path 'Icons/BSC_Icon.ico')) {
            Write-Error 'Failed to convert icon to ICO format'
            exit 1
          }
          Write-Output '✓ ICO icon created successfully'

      - name: Verify icon file exists before build
        run: |
          $iconPath = 'Icons/BSC_Icon.ico'
          if (Test-Path $iconPath) {
            $size = (Get-Item $iconPath).Length
            Write-Output "✓ Icon file verified: $iconPath ($size bytes)"
          } else {
            Write-Error "Icon file not found: $iconPath"
            exit 1
          }

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm BallSpinnerController.spec

      - name: Verify Windows executable exists
        run: |
          if (-not (Test-Path "dist\BallSpinnerController\BallSpinnerController.exe")) {
            Write-Error "Missing executable at dist\BallSpinnerController\BallSpinnerController.exe"
            exit 1
          }

      - name: Package Windows build
        run: |
          Compress-Archive -Path "dist/BallSpinnerController" -DestinationPath "dist/BallSpinnerController-Windows.zip" -Force
          if (-not (Test-Path "dist\BallSpinnerController-Windows.zip")) {
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: BallSpinnerController-Windows-app
          path: dist/BallSpinnerController-Windows.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Linux build
  # ─────────────────────────────────────────────
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          clean: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxkbcommon0 libxcb-xinerama0 libgl1-mesa-glx

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Clean previous build outputs
        run: |
          rm -rf dist build

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm BallSpinnerController.spec

      - name: Verify Linux executable exists
        run: |
          if [ ! -f "dist/BallSpinnerController/BallSpinnerController" ]; then
            echo "ERROR: Missing executable at dist/BallSpinnerController/BallSpinnerController"
            exit 1
          fi

      - name: Package Linux build
        run: |
          cd dist
          tar -czf BallSpinnerController-Linux.tar.gz BallSpinnerController/
          test -f BallSpinnerController-Linux.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: BallSpinnerController-Linux-app
          path: dist/BallSpinnerController-Linux.tar.gz
          if-no-files-found: error