name: Build Executables

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, Application_V2]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # macOS build
  # ─────────────────────────────────────────────
  build-macos:
    name: macOS
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          clean: true
          set-safe-directory: true

      - name: Verify git checkout
        run: |
          set -euo pipefail
          which git
          git --version
          git rev-parse --is-inside-work-tree
          git rev-parse HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Clean previous build outputs
        run: |
          set -euo pipefail
          rm -rf dist
          rm -rf build/pyinstaller.macos

      - name: Convert icon PNG → icns
        run: |
          set -euo pipefail
          mkdir -p Icons/BSC_Icon.iconset
          sips -z 16   16   Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_16x16.png
          sips -z 32   32   Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_16x16@2x.png
          sips -z 32   32   Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_32x32.png
          sips -z 64   64   Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_32x32@2x.png
          sips -z 128  128  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_128x128.png
          sips -z 256  256  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_128x128@2x.png
          sips -z 256  256  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_256x256.png
          sips -z 512  512  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_256x256@2x.png
          sips -z 512  512  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_512x512.png
          sips -z 1024 1024 Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_512x512@2x.png
          iconutil -c icns Icons/BSC_Icon.iconset -o Icons/BSC_Icon.icns

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm BallSpinnerController.spec

      - name: Verify macOS app bundle exists
        continue-on-error: false
        run: |
          set -euo pipefail
          if [ ! -d "dist/BallSpinnerController.app" ]; then
            echo "ERROR: Missing macOS app bundle at dist/BallSpinnerController.app"
            exit 1
          fi
          if [ ! -f "dist/BallSpinnerController.app/Contents/Info.plist" ]; then
            echo "ERROR: Missing Info.plist inside macOS app bundle"
            exit 1
          fi
          if [ ! -f "dist/BallSpinnerController.app/Contents/MacOS/BallSpinnerController" ]; then
            echo "ERROR: Missing executable inside macOS app bundle"
            exit 1
          fi

      - name: Create entitlements file
        run: |
          set -euo pipefail
          cat > /tmp/entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Ad-hoc sign macOS app bundle with entitlements
        run: |
          set -euo pipefail
          codesign --force --deep --sign - --entitlements /tmp/entitlements.plist "dist/BallSpinnerController.app"
          codesign --verify --deep --strict --verbose=2 "dist/BallSpinnerController.app"

      - name: Diagnostic - Show executable architecture and details
        run: |
          set -euo pipefail
          APP_BIN="dist/BallSpinnerController.app/Contents/MacOS/BallSpinnerController"
          echo "=== System Info ==="
          uname -m
          sw_vers
          echo ""
          echo "=== Executable Details ==="
          file "$APP_BIN"
          ls -lh "$APP_BIN"
          echo ""
          echo "=== Code Signature Details ==="
          codesign -dvvv "$APP_BIN" || true
          codesign -d --entitlements :- "$APP_BIN" || true

      - name: Diagnostic - Check bundled dependencies
        run: |
          set -euo pipefail
          APP_BIN="dist/BallSpinnerController.app/Contents/MacOS/BallSpinnerController"
          echo "=== Direct Dependencies (otool -L) ==="
          otool -L "$APP_BIN" | head -30
          echo ""
          echo "=== Framework Bundles ==="
          find "dist/BallSpinnerController.app" \( -name "*.framework" -o -name "*.so" -o -name "*.dylib" \) | head -20 || true

      - name: Smoke test app launch with diagnostics
        continue-on-error: true
        run: |
          set -euo pipefail
          APP_BIN="dist/BallSpinnerController.app/Contents/MacOS/BallSpinnerController"
          chmod +x "$APP_BIN"
          echo "=== Headless Smoke Test (QT_QPA_PLATFORM=offscreen) ==="
          QT_QPA_PLATFORM=offscreen timeout 10 "$APP_BIN" > macos-launch.log 2>&1 &
          APP_PID=$!
          sleep 6
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "✓ App survived 6 seconds in headless mode"
            kill "$APP_PID" || true
            wait "$APP_PID" 2>/dev/null || true
          else
            echo "✗ App exited during headless smoke test"
            wait "$APP_PID" 2>/dev/null
            EXIT_CODE=$?
            echo "Exit code: $EXIT_CODE"
          fi
          echo ""
          echo "=== App Output Log ==="
          cat macos-launch.log || echo "(No output captured)"

      - name: Smoke test - GUI mode with output capture
        continue-on-error: true
        run: |
          set -euo pipefail
          APP_BIN="dist/BallSpinnerController.app/Contents/MacOS/BallSpinnerController"
          echo "=== Attempting GUI Launch (5 second timeout) ==="
          timeout 5 "$APP_BIN" > macos-gui-launch.log 2>&1 || true
          EXIT_CODE=$?
          echo "Exit code: $EXIT_CODE"
          echo ""
          echo "=== GUI Mode Output Log ==="
          cat macos-gui-launch.log || echo "(No output captured)"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-diagnostics
          path: |
            macos-launch.log
            macos-gui-launch.log
          if-no-files-found: ignore

      - name: Package macOS app bundle
        run: |
          set -euo pipefail
          rm -f dist/BallSpinnerController-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent "dist/BallSpinnerController.app" "dist/BallSpinnerController-macOS.zip"
          test -f "dist/BallSpinnerController-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: BallSpinnerController-macOS-app
          path: dist/BallSpinnerController-macOS.zip
          if-no-files-found: error
