name: Build Executables

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, Application_V2]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # macOS build
  # ─────────────────────────────────────────────
  build-macos:
    name: macOS
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          clean: true
          set-safe-directory: true

      - name: Verify git checkout
        run: |
          set -euo pipefail
          which git
          git --version
          git rev-parse --is-inside-work-tree
          git rev-parse HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Clean previous build outputs
        run: |
          set -euo pipefail
          rm -rf dist
          rm -rf build/pyinstaller.macos

      - name: Convert icon PNG → icns
        run: |
          set -euo pipefail
          mkdir -p Icons/BSC_Icon.iconset
          sips -z 16   16   Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_16x16.png
          sips -z 32   32   Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_16x16@2x.png
          sips -z 32   32   Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_32x32.png
          sips -z 64   64   Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_32x32@2x.png
          sips -z 128  128  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_128x128.png
          sips -z 256  256  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_128x128@2x.png
          sips -z 256  256  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_256x256.png
          sips -z 512  512  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_256x256@2x.png
          sips -z 512  512  Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_512x512.png
          sips -z 1024 1024 Icons/BSC_Icon.png --out Icons/BSC_Icon.iconset/icon_512x512@2x.png
          iconutil -c icns Icons/BSC_Icon.iconset -o Icons/BSC_Icon.icns

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm BallSpinnerController.spec

      - name: Verify macOS app bundle exists
        continue-on-error: false
        run: |
          set -euo pipefail
          if [ ! -d "dist/BallSpinnerController.app" ]; then
            echo "ERROR: Missing macOS app bundle at dist/BallSpinnerController.app"
            exit 1
          fi
          if [ ! -f "dist/BallSpinnerController.app/Contents/Info.plist" ]; then
            echo "ERROR: Missing Info.plist inside macOS app bundle"
            exit 1
          fi
          if [ ! -f "dist/BallSpinnerController.app/Contents/MacOS/BallSpinnerController" ]; then
            echo "ERROR: Missing executable inside macOS app bundle"
            exit 1
          fi

      - name: Package macOS app bundle
        run: |
          set -euo pipefail
          rm -f dist/BallSpinnerController-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent "dist/BallSpinnerController.app" "dist/BallSpinnerController-macOS.zip"
          test -f "dist/BallSpinnerController-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: BallSpinnerController-macOS-app
          path: dist/BallSpinnerController-macOS.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Windows build
  # ─────────────────────────────────────────────
  build-windows:
    name: Windows
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Clean previous build outputs
        shell: pwsh
        run: |
          if (Test-Path 'dist') { Remove-Item 'dist' -Recurse -Force }
          if (Test-Path 'build\pyinstaller.windows') { Remove-Item 'build\pyinstaller.windows' -Recurse -Force }

      - name: Convert icon PNG → ico
        run: |
          python -c "
          from PIL import Image
          img = Image.open('Icons/BSC_Icon.png').convert('RGBA')
          img.save('Icons/BSC_Icon.ico', format='ICO',
                   sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print('Icon created: Icons/BSC_Icon.ico')
          "

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm BallSpinnerController.spec

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $root = (Get-Location).Path
          $iconPath = (Resolve-Path (Join-Path $root 'Icons\BSC_Icon.ico')).Path
          $distDir = (Resolve-Path (Join-Path $root 'dist\BallSpinnerController')).Path
          $exePath = (Resolve-Path (Join-Path $distDir 'BallSpinnerController.exe')).Path
          $distPath = Join-Path $distDir '*'
          $outputDir = (Resolve-Path (Join-Path $root 'dist')).Path

          if (-not (Test-Path $iconPath)) { throw "Missing icon: $iconPath" }
          if (-not (Test-Path $distDir)) { throw "Missing dist directory: $distDir" }
          if (-not (Test-Path $exePath)) { throw "Missing built exe: $exePath" }

          Write-Host "Using icon: $iconPath"
          Write-Host "Using dist: $distDir"
          Write-Host "Using exe:  $exePath"

          @"
          [Setup]
          AppId={{9B8A860A-7AE3-4B33-B8BC-2C88A152D5A9}
          AppName=Ball Spinner Controller
          AppVersion=1.0.0
          AppPublisher=Ball Spinner
          DefaultDirName={autopf}\Ball Spinner Controller
          DefaultGroupName=Ball Spinner Controller
          DisableProgramGroupPage=yes
          OutputDir=$outputDir
          OutputBaseFilename=BallSpinnerController-Windows-Setup
          Compression=lzma
          SolidCompression=yes
          SetupIconFile=$iconPath
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          [Languages]
          Name: ""english""; MessagesFile: ""compiler:Default.isl""

          [Tasks]
          Name: ""desktopicon""; Description: ""{cm:CreateDesktopIcon}""; GroupDescription: ""{cm:AdditionalIcons}""; Flags: unchecked

          [Files]
          Source: ""$distPath""; DestDir: ""{app}""; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: ""{group}\Ball Spinner Controller""; Filename: ""{app}\BallSpinnerController.exe""; WorkingDir: ""{app}""
          Name: ""{autodesktop}\Ball Spinner Controller""; Filename: ""{app}\BallSpinnerController.exe""; WorkingDir: ""{app}""; Tasks: desktopicon

          [Run]
          Filename: ""{app}\BallSpinnerController.exe""; Description: ""{cm:LaunchProgram,Ball Spinner Controller}""; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Path inno-setup.iss -Encoding ascii
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" inno-setup.iss

      - name: Verify Windows outputs exist
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\BallSpinnerController')) { throw 'Missing Windows portable output directory' }
          if (-not (Test-Path 'dist\BallSpinnerController\BallSpinnerController.exe')) { throw 'Missing Windows executable' }
          if (-not (Test-Path 'dist\BallSpinnerController-Windows-Setup.exe')) { throw 'Missing Windows installer exe' }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: BallSpinnerController-Windows-portable
          path: dist\BallSpinnerController\
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: BallSpinnerController-Windows-setup
          path: dist\BallSpinnerController-Windows-Setup.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Linux build
  # ─────────────────────────────────────────────
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system Qt/XCB libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libglib2.0-0 libgl1 libegl1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Clean previous build outputs
        run: |
          set -euo pipefail
          rm -rf dist
          rm -rf build/pyinstaller.linux

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller --clean --noconfirm BallSpinnerController.spec

      - name: Build AppImage
        run: |
          set -eux
          mkdir -p AppDir/usr/lib/BallSpinnerController
          cp -r dist/BallSpinnerController/* AppDir/usr/lib/BallSpinnerController/

          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/lib/BallSpinnerController/BallSpinnerController" "$@"
          EOF
          chmod +x AppDir/AppRun

          cp Icons/BSC_Icon.png AppDir/ballspinnercontroller.png

          cat > AppDir/ballspinnercontroller.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Ball Spinner Controller
          Exec=AppRun
          Icon=ballspinnercontroller
          Categories=Utility;
          Terminal=false
          EOF

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir BallSpinnerController-Linux-x86_64.AppImage

      - name: Verify Linux outputs exist
        run: |
          test -d dist/BallSpinnerController
          test -f dist/BallSpinnerController/BallSpinnerController
          test -x dist/BallSpinnerController/BallSpinnerController
          test -f BallSpinnerController-Linux-x86_64.AppImage
          test -x BallSpinnerController-Linux-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: BallSpinnerController-Linux-portable
          path: dist/BallSpinnerController/
          if-no-files-found: error

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: BallSpinnerController-Linux-AppImage
          path: BallSpinnerController-Linux-x86_64.AppImage
          if-no-files-found: error
